<style>
:root{
  --bg:#0e1416; --panel:#162023; --panel2:#1d2a2e; --line:#2b3b40;
  --text:#e6eeee; --dim:#8fa3a6; --accent:#35c9a5; --accent-bg:#12392f;
  --warn:#ffb020; --bad:#e2625a;
  --t1:#c5c5c5; --t2:#ffffff; --t3:#17a589; --t4:#00b0ff; --t5:#ffbb00; --t6:#ff7f00;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
h1,h2,h3{margin:0;font-weight:600}

header.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header.bar h1{font-size:16px}
.tagline{color:var(--dim);font-size:12px}
.topnav{display:flex;gap:8px;align-items:center}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.slot{border:1px dashed #44575e;border-radius:8px;min-height:104px;background:rgba(255,255,255,.015)}
header.bar .sub{color:var(--dim);font-size:12px}
header.bar .sp{flex:1}
.btn{padding:5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;display:inline-block;color:inherit}
.btn.primary{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.srcbtn{margin-top:8px;font-size:13px}

main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) 360px;grid-template-areas:"pool team bonds";
  height:calc(100% - 49px - var(--promo, 0px))}
/* 最上面一条：B 站介绍视频（不是弹窗，点 ✕ 后这个浏览器不再显示） */
body.haspromo{--promo:29px}
.promo{height:28px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 36px;position:relative;border-bottom:1px solid var(--line);background:var(--accent-bg);font-size:12px;white-space:nowrap;overflow:hidden}
.promo a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis}
.promo a:hover{text-decoration:underline}
.promo button{position:absolute;right:8px;top:2px;width:24px;height:24px;color:var(--dim)}
.promo button:hover{color:var(--text)}
.side{display:contents}
section{min-height:0;overflow:auto;padding:14px 16px}
#pool{grid-area:pool;border-right:1px solid var(--line)}
#team{grid-area:team;border-right:1px solid var(--line)}
#bonds{grid-area:bonds;background:var(--panel)}
.sec-title{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-title h2{font-size:15px}
.sec-title .hint{color:var(--dim);font-size:12px}

/* 筛选 */
.filters{position:sticky;top:-14px;z-index:2;background:var(--bg);padding:14px 0 8px;margin-top:-14px}
.filters input{width:100%;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
.filters input:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px;white-space:nowrap}
.chip.core{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:4px}
.bi{width:18px;height:18px;object-fit:contain;flex:none;vertical-align:middle}
.frow{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
.frow .chips{margin-top:0;flex:1;min-width:0}
.flabel{flex:none;font-size:12px;color:var(--dim);line-height:24px;width:2.2em}
.bond .bn{display:inline-flex;align-items:center;gap:5px}
.bond .bi{width:22px;height:22px}
.op .tags b{display:inline-flex;align-items:center;gap:2px}
.op .tags .bi{width:11px;height:11px}
#sheet h2{display:flex;align-items:center;gap:8px}
#sheet h2 .bi{width:30px;height:30px}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

/* 干员卡 */
.tier{margin-top:12px}
.tier h3{font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tier h3 i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--tc)}
.tier h3 span{color:var(--dim);font-weight:400;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.op{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 5px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:center}
.op:hover{border-color:var(--tc)}
.op .av{width:60px;height:60px;border-radius:6px;background:#0a0f10;border-bottom:3px solid var(--tc);overflow:hidden;display:grid;place-items:center;
  font-size:22px;color:var(--dim)}
.op .av img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.op .nm{font-size:12px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.op .tags b{font-weight:400;font-size:10px;line-height:1.3;padding:0 4px;border-radius:3px;background:var(--panel2);color:var(--dim)}
.op .tags b.lit{background:var(--accent-bg);color:var(--accent)}
.op.picked{opacity:.38}
.op.picked::after{content:"✓";position:absolute;top:3px;left:6px;color:var(--accent);font-weight:700}
.op .info{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);font-size:11px;line-height:18px;opacity:0}
.op:hover .info,.op .info:focus{opacity:1}
.op .info:hover{color:var(--accent);border-color:var(--accent)}

/* 阵容区 */
#teamGrid{min-height:220px;border:2px dashed var(--line);border-radius:10px;padding:10px;align-content:start}
#teamGrid.over{border-color:var(--accent);background:var(--accent-bg)}
#teamGrid .empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:60px 10px}
#pool.over{box-shadow:inset 0 0 0 2px var(--bad)}

/* 盟约 */
.bond{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);margin-bottom:6px}
.bond:hover{border-color:var(--accent)}
.bond .row{display:flex;align-items:center;gap:8px}
.bond .bn{font-weight:600}
.bond .kind{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.bond .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}
.bond .steps{display:flex;gap:4px;margin-top:5px;align-items:center;flex-wrap:wrap}
.bond .step{min-width:22px;text-align:center;font-size:11px;border-radius:4px;padding:0 5px;border:1px solid var(--line);color:var(--dim)}
.bond .step.hit{background:var(--accent);border-color:var(--accent);color:#04241c;font-weight:700}
.bond .st{font-size:12px;color:var(--dim);margin-left:4px}
.bond.active{border-color:var(--accent);background:var(--accent-bg)}
.bond.active .cnt,.bond.active .bn{color:var(--accent)}
.bond.active .st{color:var(--text)}
.bond.broken{border-color:var(--bad)}
.bond.broken .st{color:var(--bad)}
.bond.zero{opacity:.5}
.bond .plus{font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:0 4px}
.op .av{position:relative}
.bdgs{position:absolute;left:2px;bottom:2px;display:flex;gap:2px;align-items:flex-end}
.bdg{display:inline-flex;flex:none;width:16px;height:16px;border-radius:4px;background:rgba(8,14,15,.82);align-items:center;justify-content:center;vertical-align:-3px}
.bdg.stk{flex-direction:column-reverse;gap:2px;padding:2px 3px}
.bdg.stk i{display:block;width:100%;height:2px;border-radius:1px;background:#3d5257}
.bdg.stk.s1 i:nth-child(-n+1),.bdg.stk.s2 i:nth-child(-n+2),.bdg.stk.s3 i{background:var(--accent)}
.bdg.stk.s3{box-shadow:0 0 0 1px var(--accent)}
.bdg.coin{border-radius:50%;font-size:10px;font-weight:700;line-height:1;color:var(--t5);box-shadow:inset 0 0 0 1px #6b5a1e}
.bdg.coin.c2{box-shadow:inset 0 0 0 1.5px var(--t5)}
.bdg.coin.c3{background:var(--t5);color:#2a1e00;box-shadow:none}
.kmark{position:absolute;left:-3px;top:-3px;z-index:1;width:18px;height:18px;border-radius:5px;background:var(--t5);color:#2a1e00;
  font:800 12px/18px Arial,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--panel),0 0 8px rgba(255,187,0,.55)}
.kmark.inl{position:static;display:inline-block;box-shadow:none;vertical-align:-3px;margin-right:4px}
.op .av{overflow:visible}
.op .av img{border-radius:6px 6px 0 0}
.skm{position:absolute;right:2px;bottom:2px;min-width:15px;height:15px;padding:0 3px;border-radius:4px;background:rgba(8,14,15,.85);
  color:#fff;font:700 10px/15px Arial,sans-serif;text-align:center;box-shadow:inset 0 0 0 1px #5b7379}
.skm.split{color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.skm.inl{position:static;display:inline-block;margin-right:3px;vertical-align:-2px}
.whm{position:absolute;right:2px;top:2px;min-width:15px;height:15px;padding:0 2px;border-radius:4px;background:rgba(8,14,15,.85);
  color:#9fd8ff;font:700 10px/15px "Microsoft YaHei","PingFang SC",sans-serif;text-align:center;box-shadow:inset 0 0 0 1px #5b7379}
.whm.w1{color:var(--accent)}
.whm.w2{color:var(--warn)}
.whm.inl{position:static;display:inline-block;margin-right:3px;vertical-align:-2px}
.op.inb .whm{top:17px}
.fx a.lnk{font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--dim)}
.legend>span{display:inline-flex;align-items:center;gap:3px;max-width:100%}
.legend .bdg{vertical-align:0}
.legend[hidden]{display:none}
.morebar{display:flex;gap:16px;margin-top:8px;font-size:12px}
.morebar button{color:var(--dim)}
.morebar button.on{color:var(--text)}
.sec-title .sp{flex:1}
.empty .start{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty .btn{font-size:13px;color:var(--text)}
.empty .btn.primary{color:var(--accent)}
.monly{display:none}
.tagp.warnp{color:var(--warn);border-color:var(--warn)}
.tagp.badp{color:var(--bad);border-color:var(--bad)}
.tagp.off{text-decoration:line-through;opacity:.55}
.bcard .note{font-size:12px;color:var(--dim);margin-top:4px}
.bcard .note.bad{color:var(--bad)}
.bcard .note.warn{color:var(--warn)}
.bcard.lv2{opacity:.7}
.bcard .bhead{display:flex;align-items:center;gap:10px}
.bcard .bhead .bt{flex:1;min-width:0}
.bcard .cvs{display:flex;align-items:center;gap:4px;flex:none}
.bcard .cav{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--panel2)}
.bcard .cbi{width:26px;height:26px;object-fit:contain;margin-left:2px}
.bcard .cav.gone,.bcard .cbi.gone{filter:grayscale(1);opacity:.4}
.bcard .csi{width:30px;height:30px;border-radius:50%;object-fit:cover}
.eqs{display:flex;flex-direction:column;gap:6px}
.eqr{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5}
.eqr .eqi{display:flex;gap:2px;flex:none;flex-wrap:wrap;max-width:110px}
.eqr .eqi img{width:24px;height:24px;object-fit:contain;border-radius:4px;background:var(--panel2)}
.eqr .eqb{min-width:0}
.eqr .eqn{font-weight:600}
.eqr .eqt{color:var(--dim)}
.eqr a{color:var(--dim);font-size:12px;white-space:nowrap}
.tagp .si{width:16px;height:16px;border-radius:50%;object-fit:cover;flex:none;vertical-align:middle}
.banbox{border:1px solid var(--bad);border-radius:10px;padding:8px 10px;margin:8px 0 10px;background:var(--panel2);font-size:13px;line-height:1.6}
.banbox.warn{border-color:var(--warn)}
.banbox.ok{border-color:var(--accent)}
.banbox.tip{border-color:var(--line);color:var(--dim)}
.banbox .note{color:var(--dim);font-size:12px}
.stkbox{white-space:normal;padding:4px 12px}
.stk-row{padding:8px 0 4px;border-top:1px dashed var(--line)}
.stk-row:first-child{border-top:0}
.stk-b{font-size:12px;display:flex;gap:6px;align-items:center;color:var(--dim);margin-bottom:6px}
.stk-b b{color:var(--text);font-size:13px}
.stk-o{min-width:0}
.sop{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 9px 2px 2px;margin:0 5px 5px 0;font-size:12px;line-height:1.35;cursor:pointer;max-width:100%}
.sop:hover{border-color:var(--accent)}
.sop img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;background:#0a0f10}
.sop b{font-weight:600;white-space:nowrap}
.sop .y{color:var(--warn);font-size:11px}
.sop.core{border-color:var(--t5)}
.sop.core b::before{content:"K";display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;border-radius:4px;background:var(--t5);color:#2a1e00;font-size:10px;margin-right:4px}
.sop.out b{text-decoration:line-through;color:var(--bad)}
.sop.out img{filter:grayscale(1) brightness(.6)}
.sop .tagp{margin:0}
.tabs{display:flex;gap:6px;margin:2px 0 10px}
.tabs button{flex:1;padding:7px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--dim)}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.mcard{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px;margin-bottom:8px}
.mcard .bt{font-weight:600;font-size:15px;margin-bottom:6px}
.mcard .mnote{white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--dim);margin-top:6px}
.mcard .acts{margin-top:8px;gap:6px}
.mcard .acts .btn{padding:5px 10px;font-size:12px;flex:none}
.mavs{display:flex;flex-wrap:wrap;gap:4px}
.mavs img{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#0a0f10}
.mform input,.mform textarea{display:block;width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:16px;outline:none;margin-bottom:8px}
.mform textarea{min-height:130px;resize:vertical;margin-top:8px}
.mform input:focus,.mform textarea:focus{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
#sheet .x.back{margin-left:0;margin-right:-2px;font-size:22px;line-height:1;padding-bottom:3px}
#sheet.tall{max-height:92vh}
.bvtabs{position:sticky;top:-17px;z-index:3;background:var(--panel);margin:-8px 0 8px;padding:24px 0 6px}
.bvtabs button{font-size:14px}
.stgchips{margin:0 0 8px}
.stgnav{display:flex;justify-content:space-between;margin:4px 2px 0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);margin:4px 0 2px;cursor:pointer}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.about{margin-top:22px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim);line-height:1.7}
.about b{color:var(--text);font-weight:600}
.about p{margin:0 0 6px}
.bdg.feat.amp{color:#ff8a5c}
.bdg.feat.equip{color:#b79cff}
.bdg.feat.unit{color:#5cc8ff}
.bdg.feat.refresh{color:#7fe0d0}
.bdgs{flex-wrap:wrap-reverse;max-width:100%}
.chip.off{opacity:.35;text-decoration:line-through}
.chip.ban{opacity:.55;text-decoration:line-through;border-color:var(--bad);color:var(--bad)}
.chip.ban .bi{filter:grayscale(1)}
.banchips{flex-wrap:wrap !important;overflow:visible !important}
.banchips .chip{padding:5px 11px;font-size:13px}
.bond.banned .bn{text-decoration:line-through}
.bond.banned .st{color:var(--bad)}
.op.out .av img{filter:grayscale(1) brightness(.6)}
.op.out .av::after{content:"禁";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:4px;background:var(--bad);color:#fff;font-size:11px;line-height:16px;text-align:center}
.op.out .nm{color:var(--bad)}
.outbar{margin-top:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--bad);color:var(--text);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lnk{color:var(--accent);text-decoration:underline;font-size:12px}
.op.inb{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.op .stg{position:absolute;top:2px;right:2px;font-size:9px;line-height:1.5;padding:0 4px;border-radius:3px;background:var(--warn);color:#2a1e00;font-weight:700;z-index:1}
.op:hover .stg{display:none}
.chip.hl{border-color:var(--warn);color:var(--warn)}
.outbar.build{border-color:var(--warn)}
.bcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px;margin-bottom:8px}
.bcard:hover,.bcard.on{border-color:var(--warn)}
.bcard .bt{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.tags2{display:flex;flex-wrap:wrap;gap:4px}
.tags2 .tagp{display:inline-flex;align-items:center;gap:3px;margin-right:0}
.tags2 .bi{width:13px;height:13px}
.bst{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.bst h4{margin:0 0 6px;color:var(--text);font-size:13px}

<script>
(function(){
"use strict";
const DATA = window.SWEEP_DATA;
if(!DATA){ document.body.innerHTML = '<p style="padding:24px">没找到 data.js，先运行 <code>python parse_wiki.py</code> 生成。</p>'; return; }

const ROMAN = ["","Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ"];
const OPS = new Map(DATA.operators.map(o => [o.name, o]));
const BONDS = new Map(DATA.bonds.map(b => [b.name, b]));
const KEY = "sweep.lineup.v1";
const $ = id => document.getElementById(id);
const stat = (ev, arg) => { try{ window.SWEEP_STAT && window.SWEEP_STAT(ev, arg); }catch(e){} };   // 匿名使用统计，见 stats.js
const isMobile = () => matchMedia("(max-width: 820px)").matches;

let lineup = [];            // 干员名，按加入顺序
const filter = {core: null, extra: null, fn: null, when: []};   // 阵营、职业、功能各选一个，触发时机可多选（占其中一个就算）；几栏之间取交集
const IDX = window.SWEEP_INDEX || {ops: {}, bondSources: {}, generic: []};
const meta = n => IDX.ops[n] || {tags: []};
const FN = [   // 功能筛选：名字 + 判定
  ["key 牌", m => (m.keyWhy || []).length > 0],
  ["通用叠层卡", m => m.tags.includes("通用叠层")],
  ["通用经济卡", m => m.tags.includes("通用经济")],
  ["给钱", m => m.tags.includes("给钱")],
  ["核心叠层", m => m.stackTier === "核心"],
  ["叠层放大", m => m.tags.includes("叠层放大")],
  ["全部叠层", m => m.tags.includes("给层数")],
  ["休整期叠层", m => m.roundStack],
  ["给刷新", m => m.tags.includes("给刷新")],
  ["给装备", m => m.tags.includes("给装备")],
  ["给干员", m => m.tags.includes("给干员")],
];
// 触发时机：特质里尖括号写的词；「战斗中」的再按条件细分。普通和精锐两段特质合起来看
const WHEN = ["获得时", "进入休整期时", "休整期结束时", "战斗开始时", "开启技能时", "部署时", "击倒敌人时", "被击倒时", "战斗结束时", "售出时"];
const whenCache = new Map();
function whenOf(o){
  if(whenCache.has(o.name)) return whenCache.get(o.name);
  const t = (o.trait1 || "") + "\n" + (o.trait2 || ""), s = new Set();
  (t.match(/<[^<>]+>/g) || []).forEach(x => s.add(x.slice(1, -1)));
  if(s.delete("休整期开始时")) s.add("进入休整期时");
  if(/[“"]休整期结束时[”"]特质/.test(t)) s.add("休整期结束时");   // 塞雷娅：照抄身前干员的休整期结束时特质
  if(s.has("战斗中")){
    if(/开启技能时/.test(t)) s.add("开启技能时");
    if(/部署时(?!间)|干员部署使/.test(t)) s.add("部署时");   // 「再部署时间」「部署后」不算
    if(/被击倒时|自身被击倒/.test(t)) s.add("被击倒时");
    else if(/击倒/.test(t)) s.add("击倒敌人时");
  }
  const r = [...s]; whenCache.set(o.name, r); return r;
}
// 触发时机角标：只标这三种；一个干员占了多种时按这里的顺序取第一个
const WHEN_MARK = [["获得时", "获", "w0"], ["休整期结束时", "休", "w1"], ["开启技能时", "技", "w2"]];
function whenMark(name){
  const o = OPS.get(name); if(!o) return "";
  const w = whenOf(o), m = WHEN_MARK.find(x => w.includes(x[0]));
  return m ? '<span class="whm ' + m[2] + '" title="' + m[0] + '">' + m[1] + '</span>' : "";
}
const LV = {"核心": 3, "中等": 2, "过渡": 1};
// 角标：叠层 = 三道杠亮几道；给钱 = 金币，实心 / 半实 / 描边
// 推荐技能角标：两个来源一致显示一个数字，不一致显示「2/3」
function skillMark(name){
  const r = meta(name).skills; if(!r || !r.length) return "";
  const set = [...new Set(r.map(x => x.skill))].sort();
  return '<span class="skm' + (set.length > 1 ? " split" : "") + '" title="推荐技能">' + set.join("/") + '</span>';
}
// K = 某个盟约里最强的叠层来源。筛了阵营/职业时，只给「是所筛盟约核心件」的干员显示
function keyMark(name){
  const m = meta(name), why = m.keyWhy || [], k = m.keyFor || []; if(!why.length) return "";
  const want = [filter.core, filter.extra].filter(Boolean);
  if(want.length && k.length && !want.some(b => k.includes(b))) return "";
  return '<span class="kmark" title="key 牌' + (k.length ? "：" + esc(k.join("、")) : "") + '">K</span>';
}
function badges(name){
  const m = meta(name); let h = "";
  if(m.stackTier){ const n = LV[m.stackTier];
    h += '<span class="bdg stk s' + n + '" title="叠层 · ' + m.stackTier + '"><i></i><i></i><i></i></span>'; }
  if(m.moneyTier) h += '<span class="bdg coin c' + LV[m.moneyTier] + '" title="给钱 · ' + m.moneyTier + '">¥</span>';
  for(const [tag, cls] of FEAT) if(m.tags.includes(tag)) h += featBadge(tag, cls);
  return keyMark(name) + skillMark(name) + whenMark(name) + (h ? '<div class="bdgs">' + h + '</div>' : "");
}
// 特性角标：标签名 -> 样式类。图标是 12x12 的内联 SVG
const FEAT = [["叠层放大", "amp"], ["给装备", "equip"], ["给干员", "unit"], ["给刷新", "refresh"]];
const FEAT_SVG = {
  amp: '<path d="M2.2 6.8 6 3l3.8 3.8M2.2 10.6 6 6.8l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  equip: '<path d="M1.5 2.2h9v2.6H7.4v5.7H4.6V4.8H1.5z" fill="currentColor"/>',
  unit: '<circle cx="6" cy="3.6" r="2.3" fill="currentColor"/><path d="M1.6 11c0-2.9 1.9-4.1 4.4-4.1s4.4 1.2 4.4 4.1z" fill="currentColor"/>',
  refresh: '<path d="M9.8 6.4A3.9 3.9 0 1 1 8.6 3.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10.6 1.2v3.6H7z" fill="currentColor"/>',
};
function featBadge(tag, cls){
  return '<span class="bdg feat ' + cls + '" title="' + tag + '"><svg viewBox="0 0 12 12" width="11" height="11">' + FEAT_SVG[cls] + '</svg></span>';
}
let query = "";
const TEAM_SLOTS = 8;   // 阵容区画几个空位。只是示意这里放阵容，不是人数上限
// 「按功能筛选」「角标说明」两块的开合，点过以后记住。
// 没动过的话：功能筛选电脑上展开、手机上收起；角标说明都收起（首屏先让干员露出来）
const UI_KEY = "sweep.ui.v1";
let ui = {};
try{ ui = JSON.parse(localStorage.getItem(UI_KEY)) || {}; }catch(e){}
const uiOpen = k => ui[k] != null ? !!ui[k] : (k === "fn" && !isMobile());
try{ lineup = (JSON.parse(localStorage.getItem(KEY)) || []).filter(n => OPS.has(n)); }catch(e){}

function buildNames(b){
  const m = new Map();
  for(const st of b.stages) for(const n of [...(st.ops || []), ...(st.bench || [])]) if(!m.has(n)) m.set(n, st.short || st.label);

}

// 叠层分析：这套阵容的每个盟约，阵容里谁在给它加层。按特质数据算，不是攻略原话。
//   核心 = 这个干员是该盟约的 key 牌（数值第一 / 攻略强调 / 玩家反馈）
//   重点盟约 = 阵容里有它的核心牌；一个都没有时，取阵容里加层干员最多的那个
function buildStack(b){
  const names = buildNames(b), src = IDX.bondSources || {};
  const isCore = (n, bond) => (meta(n).keyFor || []).includes(bond) || (src[bond] || []).some(r => r.op === n && r.key);
  const perRound = y => { const m = /(\d+)\s*\/\s*回合/.exec(y || ""); return m ? +m[1] : 0; };   // 「至多 12/回合」-> 12，用来排先后
  const bonds = (b.bonds || []).map(bond => {
    const all = src[bond] || [];
    const rows = all.filter(r => names.has(r.op)).map(r => ({op: r.op, y: r.yield, core: isCore(r.op, bond), stage: names.get(r.op)}));
    rows.sort((x, y) => (y.core - x.core) || perRound(y.y) - perRound(x.y));
    const others = all.filter(r => !names.has(r.op) && OPS.has(r.op)).map(r => ({op: r.op, y: r.yield, core: isCore(r.op, bond)}));
    return {bond, rows, others, focus: rows.some(r => r.core)};
  });
  if(!bonds.some(x => x.focus)){ const top = bonds.filter(x => x.rows.length).sort((x, y) => y.rows.length - x.rows.length)[0]; if(top) top.focus = true; }
  const cm = new Map();   // 干员 -> {是哪些盟约的核心, 加层数值}
  for(const x of bonds) for(const r of x.rows) if(r.core){ const c = cm.get(r.op) || {bonds: [], y: r.y, n: perRound(r.y)}; c.bonds.push(x.bond); cm.set(r.op, c); }
  const cores = new Map([...cm].sort((x, y) => y[1].n - x[1].n));   // 每回合给得多的排前面
  const gen = new Map((IDX.generic || []).map(r => [r.op, r]));
  const helpers = [...names.keys()].filter(n => OPS.has(n) && !cores.has(n) && (gen.has(n) || meta(n).tags.includes("通用叠层")))
    .map(n => ({op: n, y: gen.has(n) ? gen.get(n).yield + "，给" + gen.get(n).scope : "", stage: names.get(n)}));
  const amps = [...names.keys()].filter(n => OPS.has(n) && meta(n).tags.includes("叠层放大")).map(n => ({op: n, stage: names.get(n)}));
  return {bonds, cores, helpers, amps};
}
// 本局禁用对一套阵容的影响。level：0 能打，1 受影响，2 核心被禁。
//   核心被禁 = 它的核心盟约被禁，或最后一个阶段（大成阵容）里的叠层核心出不来，或大成阵容缺了一半以上的人。
//   只在前期用、后面放整备区的 key 牌（比如复奏）被禁不算「核心被禁」，算「受影响」。
function buildBan(b){
  const names = buildNames(b);
  const bonds = (b.bonds || []).filter(x => banned.has(x));
  const coreBonds = bonds.filter(x => BONDS.get(x) && BONDS.get(x).kind === "core");
  const gone = n => OPS.has(n) ? isOut(OPS.get(n)) : (EXTS.has(n) && extBanned(EXTS.get(n)));
  const out = banned.size ? [...names.keys()].filter(gone) : [];
  const main = new Set(b.stages.flatMap(st => [...(st.ops || []), ...(st.bench || [])]));
  const outMain = out.filter(n => main.has(n));
  const sc = window.SWEEP_INDEX ? buildStack(b).cores : new Map();
  const last = b.noFinal ? null : ([...b.stages].reverse().find(st => (st.ops || []).length) || null);   // noFinal：攻略没报完整的成型阵容
  const lastOut = last ? last.ops.filter(n => out.includes(n)) : [];
  const cores = lastOut.filter(n => sc.has(n));
  const half = !!last && lastOut.length * 2 >= last.ops.length;
  const level = (coreBonds.length || cores.length || half) ? 2 : (bonds.length || outMain.length) ? 1 : 0;
  return {level, bonds, coreBonds, out, outMain, cores, last, lastOut, names};
}
const BAN_TAG = [["ok", "这局能打"], ["warnp", "受影响"], ["badp", "核心被禁"]];
function banWhy(r){
  const p = [];
  if(r.coreBonds.length) p.push("核心盟约【" + r.coreBonds.join("、") + "】被禁");
  const eb = r.bonds.filter(x => !r.coreBonds.includes(x));
  if(eb.length) p.push("附加盟约【" + eb.join("、") + "】干员不全");
  if(r.cores.length) p.push("叠层核心 " + r.cores.join("、") + " 不会出现");
  const rest = r.out.filter(n => !r.cores.includes(n));
  if(rest.length) p.push((r.cores.length ? "另有 " : "") + rest.slice(0, 5).join("、") + (rest.length > 5 ? " 等 " + rest.length + " 人" : "") + " 不会出现");
  if(r.last && r.lastOut.length) p.push("「" + r.last.label + "」缺 " + r.lastOut.length + " / " + r.last.ops.length + " 人");
  return p.join("；");
}

function sendShot(){
  const s = shotFail; if(!s || s.state === "sending" || s.state === "sent") return;
  s.state = "sending"; showBan();
  const url = URL.createObjectURL(s.file), img = new Image();
  const fail = () => { URL.revokeObjectURL(url); s.state = "error"; if(sameView("ban")) showBan(); };
  img.onerror = fail;
  img.onload = () => {
    try{
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.82, data = c.toDataURL("image/jpeg", q);
      while(data.length > 1150000 && q > 0.35){ q -= 0.15; data = c.toDataURL("image/jpeg", q); }
      const body = JSON.stringify({k: "shot", t: "截图没认出：" + s.info, c: "", b: activeBuild || "", p: "index", img: data.slice(data.indexOf(",") + 1)});
      fetch(FEEDBACK_URL, {method: "POST", body: body}).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(() => {
        s.state = "sent"; stat("shot_sent"); if(sameView("ban")) showBan(); toast("已发送，谢谢");
      }).catch(() => { s.state = "error"; if(sameView("ban")) showBan(); });
    }catch(e){ fail(); }
  };
  img.src = url;
}

/* ---------- 盟约计算 ----------
   人数 = 阵容里带这个盟约的不同干员数。
   调和：激活后，场上已有干员的核心盟约人数 +1。
   独行：恰好 1 名时生效，2 名及以上失效。
   绝技：按精锐干员数算，这里不知道谁是精锐，不统计。 */
function calc(){
  const raw = new Map(DATA.bonds.map(b => [b.name, 0]));
  for(const n of lineup) for(const b of OPS.get(n).bonds) if(raw.has(b)) raw.set(b, raw.get(b)+1);
  for(const n of extFielded()) for(const b of EXTS.get(n).bonds) if(raw.has(b)) raw.set(b, raw.get(b)+1);
  const harmony = BONDS.has("调和") && raw.get("调和") >= BONDS.get("调和").need;
  return DATA.bonds.map(b => {
    const base = raw.get(b.name);
    const plus = (harmony && b.kind === "core" && base > 0) ? 1 : 0;
    const count = base + plus;
    const steps = [b.need, ...b.thresholds.filter(t => t > b.need)];
    let state = "idle", level = 0, text = "";
    if(banned.has(b.name) && b.kind === "core"){ state = "banned"; text = "本局禁用"; }
    else if(b.name === "绝技"){ state = "manual"; text = "按精锐干员数计算，不自动统计"; }
    else if(b.name === "独行"){
      if(count === 1){ state = "active"; level = 1; text = "已激活"; }
      else if(count >= 2){ state = "broken"; text = "失效：在场 2 名及以上"; }
    } else {
      level = steps.filter(t => count >= t).length;
      if(level > 0){
        state = "active";
        const next = steps[level];
        text = level === 1 ? "已激活" : "已进阶（" + steps[level-1] + " 人）";
        if(next) text += "，进阶还差 " + (next - count) + " 人";
      } else if(count > 0) text = "还差 " + (b.need - count) + " 人激活";
    }
    if(banned.has(b.name) && b.kind !== "core") text = (text ? text + "，" : "") + "本局干员不全";
    return {b, base, plus, count, steps, state, level, text};
  }).sort((x, y) => rank(x) - rank(y) || y.count - x.count);
}

/* 弹层的层级。每个 show…() 开头用 setView(key, 重画函数) 报到：
   - 弹层开着、又换了一个 key → 原来那层进栈，新的一层左上角出现「‹」
   - key 和当前一样 → 只是重画，不进栈；key 在栈里已经有 → 退回到那一层
   「‹」和系统返回键（手机侧滑）回到上一层并恢复滚动位置；「✕」、点遮罩、Esc 全部关掉 */
let sheetStack = [], curView = null, sheetHist = false;
const sameView = key => $("mask").classList.contains("show") && !!curView && curView.key === key;
function setView(key, fn){
  if(!$("mask").classList.contains("show")) sheetStack = [];
  else if(curView && curView.key !== key){
    const i = sheetStack.findIndex(v => v.key === key);
    if(i >= 0) sheetStack.length = i;
    else sheetStack.push({key: curView.key, fn: curView.fn, scroll: $("sheet").scrollTop});
  }
  curView = {key, fn};
}
function openSheet(html, tall){
  const sh = $("sheet"); sh.innerHTML = html; sh.scrollTop = 0; sh.scrollLeft = 0; sh.classList.toggle("tall", !!tall);
  if(sheetStack.length){ const head = sh.querySelector(".head"); if(head) head.insertAdjacentHTML("afterbegin", '<button class="x back" data-back="1" aria-label="返回">‹</button>'); }
  if(!$("mask").classList.contains("show")){ $("mask").classList.add("show"); try{ history.pushState({sheet: 1}, ""); sheetHist = true; }catch(e){} }
}
function closeSheet(fromPop){
  if(!$("mask").classList.contains("show")) return;
  $("mask").classList.remove("show"); sheetStack = []; curView = null;
  const had = sheetHist; sheetHist = false;
  if(had && fromPop !== true){ try{ history.back(); }catch(e){} }
}
function sheetBack(){
  const v = sheetStack.pop(); if(!v) return closeSheet();
  curView = null; v.fn(); $("sheet").scrollTop = v.scroll || 0;
}
window.addEventListener("popstate", () => {
  if(!$("mask").classList.contains("show")) return;
  if(sheetStack.length){ sheetBack(); try{ history.pushState({sheet: 1}, ""); }catch(e){} }
  else closeSheet(true);
});

    saveBan(); renderFilters(); render(); return showBan(); }
  if((el = t.closest("[data-banfixed]"))){ ((EXTDATA.rules.fixedBans || [])[+el.dataset.banfixed] || {bonds: []}).bonds.forEach(b => { if(BONDS.has(b)) banned.add(b); });
    if(banned.has(filter.core)) filter.core = null; if(banned.has(filter.extra)) filter.extra = null;
    saveBan(); renderFilters(); render(); return showBan(); }
  if(t.closest("[data-banreset]")){ banned.clear(); saveBan(); renderFilters(); render(); return showBan(); }
  if(t.closest("[data-banopen]")){ shotNote = null; shotFail = null; return showBan(); }
  if(t.closest("[data-shotsend]")) return sendShot();
  if(t.closest("[data-shot]")){ $("shotFile").value = ""; return $("shotFile").click(); }
  if(t.closest("[data-showout]")){ showOut = !showOut; return renderPool(); }
  if((el = t.closest("[data-info]"))){ e.stopPropagation(); return showOp(el.dataset.info); }
  if((el = t.closest("[data-toggle]"))){ toggle(el.dataset.toggle); return sheetStack.length ? sheetBack() : closeSheet(); }
  if((el = t.closest("[data-filter]"))){ const fb = BONDS.get(el.dataset.filter); filter.core = filter.extra = filter.fn = null; filter.when = []; filter[fb.kind] = fb.name;
    renderFilters(); renderPool(); closeSheet();
    return $("pool").scrollIntoView({behavior: "smooth", block: "start"}); }
  if(t.closest("[data-allbonds]")) return showAllBonds();
  if((el = t.closest("[data-bond]"))) return showBond(el.dataset.bond);
  if((el = t.closest("[data-ui]"))){ const k = el.dataset.ui, open = k === "fn" ? (uiOpen("fn") || !!filter.fn || !!filter.when.length) : uiOpen(k);
    ui[k] = !open; if(k === "fn" && open){ filter.fn = null; filter.when = []; }
    try{ localStorage.setItem(UI_KEY, JSON.stringify(ui)); }catch(e){}
    renderFilters(); return renderPool(); }
  if((el = t.closest("[data-f]"))){ const g = el.dataset.g, v = el.dataset.f || null;
    if(g === "when") filter.when = !v ? [] : filter.when.includes(v) ? filter.when.filter(x => x !== v) : filter.when.concat(v);   // 触发可多选，点「全部」清空
    else filter[g] = filter[g] === v ? null : v;   // 再点一次已选中的 = 取消
    renderFilters(); return renderPool(); }
  if((el = t.closest(".op"))){
    const name = el.dataset.op, from = el.dataset.from;
    if(from === "sheet"){ toggle(name); const b = $("sheet").querySelector("[data-filter]"); return b ? showBond(b.dataset.filter) : closeSheet(); }
    if(from === "build"){ toggle(name); return showBuild(curBuild, true); }
    if(from === "extteam"){ ext.on = ext.on.filter(n => n !== name); saveExt(); return render(); }
    return from === "team" ? remove(name) : toggle(name);
  }
});

// 右键（电脑）/ 长按（安卓会触发 contextmenu）看特质
document.addEventListener("contextmenu", e => {
  const el = e.target.closest(".op"); if(!el) return;
  e.preventDefault(); clearTimeout(pressTimer);
  if(e.pointerType === "touch" || isMobile()) suppressClick = true;
  showOp(el.dataset.op);
});
// iOS 不触发 contextmenu，自己计时
document.addEventListener("touchstart", e => {
  const el = e.target.closest(".op"); if(!el) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { suppressClick = true; showOp(el.dataset.op); setTimeout(() => suppressClick = false, 800); }, 480);
}, {passive: true});
["touchend", "touchmove", "touchcancel"].forEach(ev => document.addEventListener(ev, () => clearTimeout(pressTimer), {passive: true}));
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

// 拖拽（电脑）
document.addEventListener("dragstart", e => {
  const el = e.target.closest && e.target.closest(".op"); if(!el) return;
  e.dataTransfer.setData("text/plain", el.dataset.op);
  e.dataTransfer.setData("application/x-from-" + el.dataset.from, "1");
  e.dataTransfer.effectAllowed = "move";
});
function dropZone(el, accept, onDrop){
  el.addEventListener("dragover", e => { if(e.dataTransfer.types.includes(accept)){ e.preventDefault(); el.classList.add("over"); } });
  el.addEventListener("dragleave", e => { if(!el.contains(e.relatedTarget)) el.classList.remove("over"); });
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over"); onDrop(e.dataTransfer.getData("text/plain")); });
}
dropZone($("teamGrid"), "application/x-from-pool", add);
dropZone($("pool"), "application/x-from-team", remove);

document.addEventListener("paste", e => {
  const cd = e.clipboardData; if(!cd) return;
  const f = [...(cd.files || [])].find(x => x.type.startsWith("image/")) ||
    [...(cd.items || [])].filter(i => i.kind === "file" && i.type.startsWith("image/")).map(i => i.getAsFile()).find(Boolean);
  if(f){ e.preventDefault(); shotNote = null; shotPick(f, "paste"); }
});

// 打开的是别人发来的分享链接（#s=…）：弹出来给他看，网址里的参数随手清掉
(function(){
  const m = /^#s=([A-Za-z0-9_-]+)$/.exec(location.hash); if(!m) return;
  try{ const d = JSON.parse(b64d(m[1])); incoming = cleanPack({n: d.n, o: d.o, x: d.x, t: d.t}); }catch(e){ incoming = null; }
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  if(incoming && (incoming.o.length + incoming.x.length)) showShared(); else incoming = null;
})();
})();
